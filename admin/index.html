<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runner</title>
<style>
	:root {
		--bg: #f6f7f9;
		--card: #ffffff;
		--text: #1d2329;
		--muted: #66707a;
		--border: #dde1e6;
		--green: #1a7f37;
		--amber: #9a6700;
		--red: #cf222e;
		--blue: #0969da;
		--log-bg: #ffffff;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #0f1215;
			--card: #171b20;
			--text: #e3e7eb;
			--muted: #8b949e;
			--border: #2b3137;
			--green: #3fb950;
			--amber: #d29922;
			--red: #f85149;
			--blue: #58a6ff;
			--log-bg: #0b0d10;
		}
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		padding: 24px 16px 48px;
		background: var(--bg);
		color: var(--text);
		font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
	}
	main { max-width: 2400px; margin: 0 auto; }
	header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin-bottom: 12px; }
	#memory { margin-left: auto; }
	h1 { font-size: 20px; margin: 0; }
	h2 { font-size: 16px; margin: 0; }
	.muted { color: var(--muted); }
	.mono, code, td.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
	#error { display: none; margin-bottom: 16px; padding: 8px 12px; border: 1px solid var(--red); border-radius: 6px; color: var(--red); }

	.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
	.tab { font: inherit; font-weight: 600; padding: 6px 2px; margin-bottom: -1px; color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; cursor: pointer; }
	.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--blue); }
	#range-label { margin-left: auto; padding-bottom: 4px; }
	[hidden] { display: none !important; }

	#apps { display: grid; gap: 12px; }
	/* one row per app: details on the left, charts on the right */
	.card { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 0 24px; align-items: start; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; min-width: 0; }
	.card > .info { min-width: 0; }
	.card > details { grid-column: 1 / -1; }
	@media (max-width: 800px) {
		.card { grid-template-columns: minmax(0, 1fr); }
	}
	.card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
	.card-head h2 { overflow-wrap: anywhere; }
	.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; font-size: 12px; font-weight: 600; }
	.s-running { color: var(--green); }
	.s-restarting, .s-deploying { color: var(--amber); }
	.s-crashed, .s-failed { color: var(--red); }
	.s-waiting, .s-stopped { color: var(--muted); }
	dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 0; }
	dt { color: var(--muted); }
	dd { margin: 0; overflow-wrap: anywhere; }
	.err { color: var(--red); }
	details { margin-top: 10px; }
	summary { cursor: pointer; color: var(--muted); }
	table { width: 100%; border-collapse: collapse; margin-top: 6px; }
	th, td { text-align: left; padding: 3px 6px 3px 0; border-top: 1px solid var(--border); vertical-align: top; }
	th { color: var(--muted); font-weight: 500; }
	td.reason { overflow-wrap: anywhere; }

	.log-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 8px; }
	select { font: inherit; padding: 3px 6px; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 6px; }
	label { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
	#log {
		height: calc(100vh - 160px);
		min-height: 300px;
		overflow: auto;
		margin: 0;
		padding: 8px 10px;
		background: var(--log-bg);
		border: 1px solid var(--border);
		border-radius: 8px;
		white-space: pre-wrap;
		overflow-wrap: anywhere;
	}
	#log .t { color: var(--muted); user-select: none; }
	#log .warn { color: var(--red); }
	#stream { font-size: 12px; }

	.charts { display: grid; gap: 8px; touch-action: pan-y; }
	@media (max-width: 800px) {
		.charts { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
	}
	.chart-head { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
	.chart-head b { font-weight: 600; font-variant-numeric: tabular-nums; }
	.chart svg { display: block; width: 100%; height: 64px; overflow: visible; }
	.chart .line { fill: none; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
	.chart .area { stroke: none; opacity: 0.12; }
	.chart .cursor { stroke: var(--muted); stroke-width: 1; vector-effect: non-scaling-stroke; }
	.chart-span { display: flex; justify-content: space-between; font-size: 11px; }
</style>
</head>
<body>
<main>
	<header>
		<h1>Runner</h1>
		<span class="muted" id="meta">loading…</span>
		<span class="muted" id="memory"></span>
	</header>
	<div id="error"></div>
	<nav class="bar" role="tablist">
		<button class="tab" role="tab" id="tab-apps" aria-controls="apps" aria-selected="true">Apps</button>
		<button class="tab" role="tab" id="tab-logs" aria-controls="logs" aria-selected="false">Logs</button>
		<label id="range-label">Charts
			<select id="range" aria-label="Chart range">
				<option value="12">last 12h</option>
				<option value="24">last 24h</option>
			</select>
		</label>
	</nav>
	<div id="apps" role="tabpanel" aria-labelledby="tab-apps"></div>

	<section id="logs" role="tabpanel" aria-labelledby="tab-logs" hidden>
		<div class="log-bar">
			<select id="source" aria-label="Log source">
				<option value="runner">runner</option>
			</select>
			<label><input type="checkbox" id="follow" checked> follow</label>
			<span class="muted" id="stream"></span>
		</div>
		<pre id="log" class="mono"></pre>
	</section>
</main>
<script>
"use strict";

// the status and metrics are fetched once a minute, since metrics are
// aggregated per minute; the poll lands POLL_AFTER_MS after each minute
// starts on the server, so the minute just written shows up right away
const POLL_MS = 60000;
const POLL_AFTER_MS = 3000;
// the page is redrawn from the last status this often, without a request,
// so ages such as "16s ago" keep counting
const RENDER_MS = 2000;
// lines kept in the page; the server keeps the last 1000 per source
const MAX_LOG_LINES = 2000;

const $ = (id) => document.getElementById(id);

// api resolves a path next to this page without any user:password@ from the
// address bar, which fetch and EventSource reject; the browser still sends
// the credentials it was given for this page
function api(path) {
	const url = new URL(path, location.href);
	url.username = url.password = "";
	return url.href;
}
// deploy lists the user opened, by external port, kept across re-renders
const openDeploys = new Set();
// requests since runner started by external port, shown on the requests chart
const requestTotals = new Map();
// per-minute metrics by external port: {points}, the last 24 hours
const metrics = new Map();
// hours the charts show, picked at the top; the server keeps 24
let rangeHours = 12;
// the minute the pointer is on, shared by the charts of one card: {port, index}
let hover = null;
// server clock minus browser clock, so ages are right with a skewed clock
let skewMs = 0;

function esc(s) {
	return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function now() { return Date.now() + skewMs; }

// duration formats milliseconds as e.g. "3d 4h", "5m 2s", "800ms"
function duration(ms) {
	if (ms < 1000) return Math.max(0, Math.round(ms)) + "ms";
	let s = Math.round(ms / 1000);
	const parts = [];
	for (const [unit, size] of [["d", 86400], ["h", 3600], ["m", 60], ["s", 1]]) {
		if (s >= size || (unit === "s" && parts.length === 0)) {
			parts.push(Math.floor(s / size) + unit);
			s %= size;
		}
		if (parts.length === 2) break;
	}
	return parts.join(" ");
}

function ago(iso) { return iso ? duration(now() - Date.parse(iso)) + " ago" : "never"; }
function until(iso) { return iso ? "in " + duration(Date.parse(iso) - now()) : "—"; }
function clock(iso) { return new Date(iso).toLocaleTimeString(); }
// minute formats a chart time as e.g. "14:05", with the weekday when it is not today
function minute(iso) {
	const d = new Date(iso);
	const opts = { hour: "2-digit", minute: "2-digit" };
	if (d.toDateString() !== new Date(now()).toDateString()) opts.weekday = "short";
	return d.toLocaleTimeString([], opts);
}

// mb formats a memory size in KB, e.g. "21.4 MB"
function mb(kb) { return kb == null ? "—" : (kb / 1024).toFixed(1) + " MB"; }

// renderMemory shows the memory of runner and of the processes it started in
// the header; it is empty when memory is not read, outside Linux
function renderMemory(memory) {
	if (!memory) return "";
	return `Memory ${mb(memory.runnerKb)} runner · ${mb(memory.totalKb - memory.runnerKb)} apps · <b>${mb(memory.totalKb)}</b> total`;
}

// the card title: the deployed artifact's name, which tells apart the apps of
// a monorepo; the repo until the first deploy
function appTitle(app) {
	return app.artifactName || app.name;
}

function renderApp(app) {
	const running = app.artifactId !== 0;
	const rows = [];
	const row = (k, v) => rows.push(`<dt>${k}</dt><dd>${v}</dd>`);

	if (app.error) row("Error", `<span class="err">${esc(app.error)}</span>`);
	if (appTitle(app) !== app.name) row("Repo", esc(app.name));
	row("Version", running
		? `<span class="mono">#${app.artifactId}</span>` + (app.branch ? ` · ${esc(app.branch)}` : "")
		: "none deployed");
	if (running) {
		const parts = [`pid <span class="mono">${app.pid}</span> <span class="mono">:${app.internalPort}</span>`];
		if (app.state === "running" && app.startedAt) parts.push("up " + duration(now() - Date.parse(app.startedAt)));
		if (app.restarts) parts.push(`<span class="s-restarting">${app.restarts} restart${app.restarts === 1 ? "" : "s"}</span>`);
		row("Process", parts.join(" · "));
	}
	// only apps with a workDir have a hash or an error reading it
	if (app.workDirHash || app.workDirError) {
		row("Work dir", (app.workDirHash ? `<span class="mono">${esc(app.workDirHash)}</span> · changed ${ago(app.workDirChangedAt)}` : "") +
			(app.workDirError ? `${app.workDirHash ? "<br>" : ""}<span class="err">${esc(app.workDirError)}</span>` : ""));
	}
	row("Polling", `${ago(app.lastPoll)} · next ${until(app.nextPoll)}` +
		(app.lastPollError ? `<br><span class="err">${esc(app.lastPollError)}</span>` : ""));
	if (app.failedArtifactIds.length) {
		row("Failed", app.failedArtifactIds.map((id) => `<span class="mono">#${id}</span>`).join(", "));
	}

	let deploys = `<p class="muted" style="margin:10px 0 0">No deploys yet.</p>`;
	if (app.deploys.length) {
		const trs = app.deploys.map((d) => `<tr>
			<td>${esc(clock(d.time))}</td>
			<td class="mono">#${d.artifactId}</td>
			<td class="s-${d.result === "success" ? "running" : "failed"}">${esc(d.result)}</td>
			<td>${duration(d.durationMs)}</td>
			<td class="reason">${esc(d.reason)}</td></tr>`).join("");
		deploys = `<details data-port="${app.externalPort}"${openDeploys.has(app.externalPort) ? " open" : ""}>
			<summary>Recent deploys (${app.deploys.length})</summary>
			<table><thead><tr><th>Started</th><th>Artifact</th><th>Result</th><th>Took</th><th>Reason</th></tr></thead>
			<tbody>${trs}</tbody></table></details>`;
	}

	requestTotals.set(app.externalPort, app.requestsTotal);
	const charts = `<div class="charts" data-port="${app.externalPort}">${renderCharts(app.externalPort)}</div>`;

	const deploying = app.deployingArtifactId
		? `<span class="badge s-deploying">deploying #${app.deployingArtifactId}</span>` : "";
	return `<article class="card">
		<div class="info">
			<div class="card-head">
				<h2>${esc(appTitle(app))}</h2>
				<span class="muted mono">:${app.externalPort}</span>
				<span class="badge s-${esc(app.state)}">${esc(app.state)}</span>
				${deploying}
			</div>
			<dl>${rows.join("")}</dl>
		</div>
		${charts}
		${deploys}
	</article>`;
}

// chart width and height in SVG units; the SVG stretches to the row
const CW = 1000, CH = 64;
// a gap longer than this between minutes breaks the line, e.g. while runner
// was down or before the first deploy
const GAP_MS = 2.5 * 60 * 1000;

const SERIES = [
	{ label: "Requests / min", note: (port) => `${(requestTotals.get(port) ?? 0).toLocaleString()} total`, lines: [["requests", "var(--blue)"]], bars: ["status5xx", "var(--red)"],
		format: (p) => `${p.requests}` + (p.status5xx ? ` <span class="err">${p.status5xx} 5xx</span>` : "") },
	{ label: "p95 latency", lines: [["p95Ms", "var(--amber)"]], format: (p) => duration(p.p95Ms) },
	{ label: "Memory", lines: [["rssKb", "var(--green)"]], optional: true, format: (p) => mb(p.rssKb) },
];

// shownPoints returns the minutes of the port within the picked range
function shownPoints(port) {
	const points = metrics.get(port)?.points ?? [];
	const from = now() - rangeHours * 3600 * 1000;
	const i = points.findIndex((p) => Date.parse(p.time) >= from);
	return i < 0 ? [] : points.slice(i);
}

// renderCharts draws one SVG sparkline per series from the minutes in
// metrics, with a cursor on the hovered minute; series without data, such
// as memory outside Linux, are left out
function renderCharts(port) {
	const points = shownPoints(port);
	if (points.length < 2) return `<p class="muted" style="margin:0">Charts show up after two minutes with a deployed version or requests.</p>`;
	const t0 = Date.parse(points[0].time), t1 = Date.parse(points[points.length - 1].time);
	const x = (p) => ((Date.parse(p.time) - t0) / (t1 - t0)) * CW;
	const index = hover && hover.port === port ? Math.min(hover.index, points.length - 1) : -1;
	const shown = points[index >= 0 ? index : points.length - 1];

	const charts = SERIES.map((series) => {
		const keys = series.lines.map(([key]) => key).concat(series.bars ? [series.bars[0]] : []);
		const values = points.flatMap((p) => keys.map((key) => p[key])).filter((v) => v != null);
		if (series.optional && values.length === 0) return "";
		const top = Math.max(1, ...values);
		const y = (v) => CH - (v / top) * (CH - 2) - 1;
		const paths = series.lines.map(([key, color]) => {
			let line = "", area = "", start = null, prev = null;
			const close = () => { if (start != null) area += `L${prev.toFixed(1)} ${CH}L${start.toFixed(1)} ${CH}Z`; start = null; };
			points.forEach((p, i) => {
				const v = p[key];
				const gap = i > 0 && Date.parse(p.time) - Date.parse(points[i - 1].time) > GAP_MS;
				if (v == null || gap) close();
				if (v == null) return;
				const px = x(p), py = y(v);
				const cmd = start == null ? "M" : "L";
				line += `${cmd}${px.toFixed(1)} ${py.toFixed(1)}`;
				area += start == null ? `M${px.toFixed(1)} ${CH}L${px.toFixed(1)} ${py.toFixed(1)}` : `L${px.toFixed(1)} ${py.toFixed(1)}`;
				if (start == null) start = px;
				prev = px;
			});
			close();
			return `<path class="area" d="${area}" fill="${color}"/><path class="line" d="${line}" stroke="${color}"/>`;
		}).join("");
		// minutes with errors as bars, so error-free minutes draw nothing
		let bars = "";
		if (series.bars) {
			const [key, color] = series.bars;
			const d = points.filter((p) => p[key] > 0).map((p) => `M${x(p).toFixed(1)} ${CH}V${y(p[key]).toFixed(1)}`).join("");
			if (d) bars = `<path class="line" d="${d}" stroke="${color}"/>`;
		}
		const cursor = index >= 0 ? `<line class="cursor" x1="${x(points[index]).toFixed(1)}" x2="${x(points[index]).toFixed(1)}" y1="0" y2="${CH}"/>` : "";
		return `<div class="chart">
			<div class="chart-head"><span class="muted">${series.label}${series.note ? ` · ${series.note(port)}` : ""}</span><span><b>${series.format(shown)}</b></span></div>
			<svg viewBox="0 0 ${CW} ${CH}" preserveAspectRatio="none" role="img" aria-label="${series.label.replace(/<[^>]*>/g, "")}, last ${duration(t1 - t0)}">${paths}${bars}${cursor}</svg>
		</div>`;
	}).join("");
	const at = index >= 0 ? `<b>${minute(points[index].time)}</b>` : "";
	return `${charts}<div class="chart-span muted"><span>${minute(points[0].time)}</span><span>${at}</span><span>${minute(points[points.length - 1].time)}</span></div>`;
}

// fetchMetrics refreshes the metrics of the ports
async function fetchMetrics(ports) {
	await Promise.all(ports.map(async (port) => {
		try {
			const res = await fetch(api("metrics?app=" + port), { cache: "no-store" });
			if (res.ok) metrics.set(port, { points: (await res.json()).points });
		} catch {}
	}));
	// forget apps that were removed
	for (const port of metrics.keys()) {
		if (!ports.includes(port)) metrics.delete(port);
	}
}

// hovering a chart moves the cursor of all charts of that row to the
// nearest minute; only that row's charts are redrawn
function chartsOf(port) { return document.querySelector(`.charts[data-port="${port}"]`); }

$("apps").addEventListener("pointermove", (e) => {
	const svg = e.target.closest(".chart svg");
	if (!svg) return;
	const port = Number(svg.closest(".charts").dataset.port);
	const points = shownPoints(port);
	if (points.length < 2) return;
	const box = svg.getBoundingClientRect();
	const frac = Math.min(1, Math.max(0, (e.clientX - box.left) / box.width));
	const t0 = Date.parse(points[0].time), t1 = Date.parse(points[points.length - 1].time);
	const t = t0 + frac * (t1 - t0);
	let index = 0;
	points.forEach((p, i) => { if (Math.abs(Date.parse(p.time) - t) < Math.abs(Date.parse(points[index].time) - t)) index = i; });
	if (hover && hover.port === port && hover.index === index) return;
	hover = { port, index };
	chartsOf(port).innerHTML = renderCharts(port);
});

// pointerleave does not bubble, so capture it; leaving a chart for another
// chart of the same row keeps the cursor
$("apps").addEventListener("pointerleave", (e) => {
	if (!hover || !e.target.classList?.contains("charts")) return;
	const port = hover.port;
	hover = null;
	const el = chartsOf(port);
	if (el) el.innerHTML = renderCharts(port);
}, true);

let knownSources = "";

function updateSources(apps) {
	const key = apps.map((a) => a.externalPort + " " + appTitle(a)).join("|");
	if (key === knownSources) return;
	knownSources = key;
	const select = $("source");
	const current = select.value;
	select.innerHTML = `<option value="runner">runner</option>` +
		apps.map((a) => `<option value="${a.externalPort}">${esc(appTitle(a))} :${a.externalPort}</option>`).join("");
	if ([...select.options].some((o) => o.value === current)) select.value = current;
}

// the last status fetched, and when
let last = null, updated = null;

function render() {
	if (!last) return;
	const s = last;
	$("meta").textContent = `${s.version} · up ${duration(now() - Date.parse(s.startedAt))} · updated ${updated.toLocaleTimeString()}`;
	$("memory").innerHTML = renderMemory(s.memory);
	$("apps").innerHTML = (s.apps.length ? s.apps.map(renderApp).join("") : `<p class="muted">No apps configured.</p>`);
}

async function poll() {
	try {
		const res = await fetch(api("status"), { cache: "no-store" });
		if (!res.ok) throw new Error(`status ${res.status}`);
		const s = await res.json();
		await fetchMetrics(s.apps.map((a) => a.externalPort));
		skewMs = Date.parse(s.now) - Date.now();
		last = s;
		updated = new Date();
		render();
		updateSources(s.apps);
		$("error").style.display = "none";
	} catch (e) {
		$("error").textContent = `Cannot reach runner: ${e.message}. Retrying…`;
		$("error").style.display = "block";
	}
	// a change in clock skew could land the next minute's poll right after
	// this one, so it is never sooner than POLL_AFTER_MS * 2
	let wait = POLL_MS - ((now() - POLL_AFTER_MS) % POLL_MS + POLL_MS) % POLL_MS;
	if (wait < POLL_AFTER_MS * 2) wait += POLL_MS;
	setTimeout(poll, wait);
}

setInterval(render, RENDER_MS);

// remember which deploy lists are open; toggle does not bubble, so capture it
$("apps").addEventListener("toggle", (e) => {
	const port = Number(e.target.dataset.port);
	if (e.target.open) openDeploys.add(port); else openDeploys.delete(port);
}, true);

let stream = null;

function appendLine(line) {
	const log = $("log");
	const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
	const div = document.createElement("div");
	const t = document.createElement("span");
	t.className = "t";
	t.textContent = new Date(line.time).toLocaleTimeString() + "  ";
	const text = document.createElement("span");
	text.textContent = line.text;
	if (/\b(fail|failed|error|panic|crash|exited unexpectedly)/i.test(line.text)) text.className = "warn";
	div.append(t, text);
	log.append(div);
	while (log.childElementCount > MAX_LOG_LINES) log.firstElementChild.remove();
	if ($("follow").checked && atBottom) log.scrollTop = log.scrollHeight;
}

function openStream() {
	if (stream) stream.close();
	const source = $("source").value;
	try { localStorage.setItem("runner-log-source", source); } catch {}
	$("log").textContent = "";
	stream = new EventSource(api("logs?app=" + encodeURIComponent(source)));
	// the server replays its buffer on every (re)connect, so start over
	stream.onopen = () => {
		$("log").textContent = "";
		$("stream").textContent = "live";
	};
	stream.onmessage = (e) => appendLine(JSON.parse(e.data));
	stream.onerror = () => { $("stream").textContent = "reconnecting…"; };
}

$("source").addEventListener("change", openStream);

// showTab switches between the apps and the logs; the log stream stays open
// while hidden, so no lines are missed
function showTab(name) {
	const logs = name === "logs";
	$("tab-apps").setAttribute("aria-selected", String(!logs));
	$("tab-logs").setAttribute("aria-selected", String(logs));
	$("apps").hidden = logs;
	$("logs").hidden = !logs;
	$("range-label").hidden = logs;
	try { localStorage.setItem("runner-tab", name); } catch {}
	if (logs && $("follow").checked) $("log").scrollTop = $("log").scrollHeight;
}
$("tab-apps").addEventListener("click", () => showTab("apps"));
$("tab-logs").addEventListener("click", () => showTab("logs"));

$("range").addEventListener("change", () => {
	rangeHours = Number($("range").value);
	try { localStorage.setItem("runner-range", String(rangeHours)); } catch {}
	hover = null;
	render();
});

try {
	if (localStorage.getItem("runner-tab") === "logs") showTab("logs");
	if (localStorage.getItem("runner-range") === "24") { rangeHours = 24; $("range").value = "24"; }
} catch {}
$("follow").addEventListener("change", () => {
	if ($("follow").checked) $("log").scrollTop = $("log").scrollHeight;
});

(async () => {
	await poll();
	try {
		const saved = localStorage.getItem("runner-log-source");
		if (saved && [...$("source").options].some((o) => o.value === saved)) $("source").value = saved;
	} catch {}
	openStream();
})();
</script>
