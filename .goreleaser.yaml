version: 2

project_name: runner

builds:
  - id: runner
    main: .
    binary: runner
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: runner
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^Merge "
      - "(?i)\\bREADME\\b"
      - "(?i)\\bCI\\b"
      - "(?i)\\bin e2e\\b"
  groups:
    - title: Fixes
      regexp: "(?i)\\b(fix|crash|reject|do not|skip)"
      order: 0
    - title: Changes
      order: 1
